<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: a fixed instrument-style rail on the left, one working surface on the right. IDs are always monospaced. */
:root{
  --rail:#0F3D3E; --rail-ink:#DDEEEA; --rail-dim:#8FC7BF; --rail-on:#1B7F79;
  --bg:#F3F7F6; --surface:#FFFFFF; --sunken:#E7F1EF; --line:#CFE1DD;
  --ink:#16302F; --mute:#55706D; --accent:#14706A; --accent-ink:#FFFFFF;
  --good-bg:#D5EEE6; --good:#11594F; --warn-bg:#FBEFD9; --warn:#7A4E08; --bad-bg:#F8DFD9; --bad:#93351F; --idle-bg:#E7ECEB; --idle:#4C605E;
  --display:"Source Serif 4",Cambria,Georgia,serif; --body:"IBM Plex Sans",Calibri,Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1B1B; --surface:#142625; --sunken:#1C3331; --line:#2B4644; --ink:#E4F0EE; --mute:#9DB7B3; --accent:#3FB8AC; --accent-ink:#06211F;
  --good-bg:#17403A; --good:#9FE3D2; --warn-bg:#46361A; --warn:#F5D08C; --bad-bg:#4A2419; --bad:#F7B7A5; --idle-bg:#263A38; --idle:#B3C8C5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1B1B; --surface:#142625; --sunken:#1C3331; --line:#2B4644; --ink:#E4F0EE; --mute:#9DB7B3; --accent:#3FB8AC; --accent-ink:#06211F;
  --good-bg:#17403A; --good:#9FE3D2; --warn-bg:#46361A; --warn:#F5D08C; --bad-bg:#4A2419; --bad:#F7B7A5; --idle-bg:#263A38; --idle:#B3C8C5; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
#rail{background:var(--rail);color:var(--rail-ink);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;align-self:start}
.brand{background:#fff;border-radius:10px;padding:10px 12px;text-align:center}
.brand img{display:block;width:100%;max-width:176px;margin:0 auto}
.brand span{display:block;color:#0F3D3E;font-weight:700;font-size:13px;margin-top:3px}
nav{display:flex;flex-direction:column;gap:3px}
nav a{display:flex;justify-content:space-between;align-items:center;color:var(--rail-ink);text-decoration:none;padding:9px 11px;border-radius:8px;font-weight:500}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.on{background:var(--rail-on);color:#fff;font-weight:600}
nav a b{background:#E8A33D;color:#16302F;font-size:12px;border-radius:9px;padding:0 7px;line-height:18px}
.who{margin-top:auto;font-size:13px;color:var(--rail-dim)}
main{padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 30px/1.15 var(--display);margin:0;text-wrap:balance}
h2{font:600 16px/1.3 var(--body);margin:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sub{color:var(--mute);margin:3px 0 0;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mono{font-family:var(--mono);font-size:.93em}
a{color:var(--accent)}
.btn{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;border-radius:6px;padding:1px 9px;font-size:13px;font-weight:600;background:var(--idle-bg);color:var(--idle);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.tw{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;border-bottom:2px solid var(--line);padding:6px 9px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:middle}
tr.link{cursor:pointer}tr.link:hover td{background:var(--sunken)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mute);min-width:0}
label.f.w{grid-column:1/-1}
input,textarea,select{font:15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto}
input[disabled],textarea[disabled],select[disabled]{background:var(--sunken);color:var(--ink);opacity:1}
td input{min-width:84px}
textarea{min-height:66px;resize:vertical}
.calc{font-family:var(--mono);white-space:nowrap}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column}
.stage:hover{border-color:var(--accent)}
.stage b{font:700 30px/1.1 var(--display)}
.stage span{color:var(--mute);font-size:13px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px}
.empty{color:var(--mute);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.scheme{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;color:#16302F}
.scheme img{max-height:150px}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.log{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--mute)}
.chk{display:flex;gap:9px;align-items:center}
.trail{display:flex;gap:8px;flex-wrap:wrap}
.trail span{flex:1 1 110px;text-align:center}
.sheet{background:#fff;color:#16302F;border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;--line:#CFE1DD;--mute:#55706D;--ink:#16302F;--accent:#14706A;--idle-bg:#E7ECEB;--idle:#4C605E;--good-bg:#D5EEE6;--good:#11594F;--warn-bg:#FBEFD9;--warn:#7A4E08;--bad-bg:#F8DFD9;--bad:#93351F}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:10px}
.sheet .top img{height:62px;max-width:45%}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px}
#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--rail);color:#fff;padding:10px 16px;border-radius:9px;max-width:min(420px,calc(100vw - 32px));z-index:20}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  #rail{position:static;height:auto;flex-direction:column;gap:10px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .brand{max-width:170px}
  nav{flex-direction:row;overflow-x:auto}
  nav a{white-space:nowrap;gap:6px}
  .who{display:none}
  .two,.tests{grid-template-columns:minmax(0,1fr)}
}
</style>

<script>
"use strict";
const TESTS=["HPLC","LCMS","GCMS","NMR"];
const TESTNAME={HPLC:"HPLC assay",LCMS:"LCMS",GCMS:"GCMS",NMR:"1H NMR"};
const OUTCOMES=["Pending","Pass","Fail","Confirmed","Not confirmed"];
const CHECKS=["Reaction image and SMILES are in the entry","Masses and lot numbers match the bench work","Calculations are checked by a second person","Raw data and balance printouts are linked"];
const S={entries:{},requests:{},samples:{},loaded:{},images:{},busy:false,hash:"",me:{email:"",name:""},assets:true,readOnly:false,noDb:false,draft:null,dirty:false,stale:false,arm:null,failed:false};

/* ---------- helpers ---------- */
const $=(q,r=document)=>r.querySelector(q);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:null};
const fix=(n,d)=>n==null||!Number.isFinite(n)?"–":n.toFixed(d);
const clone=o=>JSON.parse(JSON.stringify(o));
const now=()=>new Date().toISOString();
const when=t=>{if(!t)return "";const d=new Date(t);return isNaN(d)?"":d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})};
const list=m=>Object.values(m).sort((a,b)=>String(b.id).localeCompare(String(a.id)));
const whoName=h=>h.by||"Someone";
const safeUrl=u=>/^https:\/\//i.test(String(u||"").trim())?String(u).trim():"";
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4000)}
function fail(e){toast((e&&e.message)||"That didn't save. Check your connection, then try again.")}
const chip=(t)=>{const c=/Signed|Done|Pass|Confirmed|Approved|issued|Received|Complete/.test(t)&&!/Not confirmed/.test(t)?"good":/Fail|Not confirmed/.test(t)?"bad":/Draft|Pending|Requested|Submitted|review|testing|Registered/.test(t)?"warn":"";return `<span class="chip ${c}">${esc(t)}</span>`};

/* ---------- calculations ---------- */
function calc(e){
  const rows=(e.reagents||[]).map(r=>{const mass=num(r.mass),mw=num(r.mw);return {mmol:mass!=null&&mw?mass/mw*1000:null}});
  const lim=rows[e.limiting|0]?rows[e.limiting|0].mmol:null;
  rows.forEach(r=>r.equiv=r.mmol!=null&&lim?r.mmol/lim:null);
  const pm=num(e.productMw),act=num(e.actualYield);
  const theo=lim!=null&&pm?lim*pm/1000:null;
  return {rows,lim,theo,pct:theo&&act!=null?act/theo*100:null};
}
function nextId(prefix,map){
  const y=new Date().getFullYear(),p=`${prefix}-${y}-`;let max=0;
  for(const k of Object.keys(map)) if(k.startsWith(p)){const n=parseInt(k.slice(p.length,p.length+4),10);if(n>max)max=n}
  return p+String(max+1).padStart(4,"0");
}
function nextSample(entryId){let n=0;for(const r of Object.values(S.requests)) if(r.entryId===entryId)n++;return `${entryId}-S${String(n+1).padStart(2,"0")}`}
function sampleStatus(s){
  if(s.reportIssued)return "Report issued"; if(s.approved)return "Approved";
  const t=Object.values(s.tests||{}),done=t.filter(x=>x.outcome&&x.outcome!=="Pending"&&x.result);
  if(t.length&&done.length===t.length)return "Ready for review"; if(done.length)return "In testing"; return "Registered";
}

/* ---------- data ---------- */
let SB=null;  // Supabase client: handles sign-in and direct file uploads
async function api(fn,...a){
  const {data:{session}}=await SB.auth.getSession();
  if(!session){showLogin();throw new Error("Sign in to continue.")}
  let r;try{r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({fn,args:a})})}
  catch(e){throw new Error("That didn't save. Check your connection, then try again.")}
  const j=await r.json().catch(()=>({error:"The server did not answer. Try again."}));
  if(r.status===401)showLogin(j.error);
  if(!r.ok||j.error)throw new Error(j.error||"Request failed ("+r.status+")");
  return j.result;
}
function showLogin(msg){
  S.authed=false;$("#nav").innerHTML="";$("#who").textContent="";
  $("#main").innerHTML=`<div class="wrap"><div class="panel" style="max-width:420px;margin:8vh auto 0">
  <h1>Oceanic Lab Workflow</h1><p class="sub">Sign in with your lab account.</p>
  <form data-form="login" class="form" style="grid-template-columns:1fr">
  <label class="f">Email<input id="l-email" type="email" autocomplete="username" required></label>
  <label class="f">Password<input id="l-pass" type="password" autocomplete="current-password"></label>
  <button class="btn pri" type="submit">Sign in</button>
  <button class="btn" type="button" data-act="magic-link">Email me a sign-in link instead</button>
  </form><p class="sub" id="l-msg">${esc(msg||"")}</p></div></div>`;
}
async function boot(){
  try{
    const c=await (await fetch("/api?config")).json();
    if(c.error)throw new Error(c.error);
    SB=supabase.createClient(c.supabaseUrl,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  }catch(e){S.failed=true;S.failMsg=(e&&e.message)||"The app can't reach its server.";render();return}
  SB.auth.onAuthStateChange((ev,session)=>{if(ev==="SIGNED_IN"&&session&&!S.authed){S.authed=true;S.failed=false;start()}if(ev==="SIGNED_OUT")showLogin("You are signed out.")});
  const {data:{session}}=await SB.auth.getSession();
  if(session){if(!S.authed){S.authed=true;start()}}else showLogin();
}
async function refresh(){
  const r=JSON.parse(await api("getState"));S.me=r.me;S.entries=r.entries;S.requests=r.requests;S.samples=r.samples;
  S.loaded={entries:1,requests:1,samples:1};S.failed=false;soft();
}
async function start(){
  try{await refresh()}catch(e){S.failed=true;S.failMsg=e&&e.message;render();return}
  if(!S.timer)S.timer=setInterval(()=>{if(S.authed&&!document.hidden&&!S.busy)refresh().catch(()=>{})},30000);
}
function soft(){const a=document.activeElement;if(S.dirty||(a&&a.closest&&a.closest("#main")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){S.stale=true;navOnly();return}render()}

/* ---------- routing ---------- */
function route(){const h=S.hash||"";const m=h.match(/^(entry|sample|sheet)-(.+)$/);return m?{v:m[1],id:m[2]}:{v:h||"home"}}
function autosave(){const d=S.draft;if(!S.dirty||!d||d.kind==="req"||!d.id)return;
  const fn=d.tests?"saveSample":"saveEntry",c=d.tests?"samples":"entries";
  api(fn,JSON.stringify(d)).then(j=>{const x=JSON.parse(j);S[c][x.id]=x;toast("Your changes were saved")}).catch(fail)}

const history=d=>`<div class="panel"><h2>Activity</h2><div class="log">${[...(d.history||[])].reverse().map(h=>`<div>${esc(when(h.at))}: ${esc(h.action)} (${esc(whoName(h))})</div>`).join("")||"No activity yet."}</div></div>`;
function recalc(){
  const e=S.draft;if(!e||!e.reagents)return;const c=calc(e);
  c.rows.forEach((r,i)=>{const a=$("#mm"+i),b=$("#eq"+i);if(a)a.textContent=fix(r.mmol,1);if(b)b.textContent=fix(r.equiv,2)});
  const t=$("#theo"),p=$("#pct");if(t)t.textContent=fix(c.theo,2)+" g";if(p)p.textContent=fix(c.pct,1)+"%";
}

  <div class="form" style="grid-template-columns:1fr 1fr"><label class="f">Method<input id="${k}-m" data-bind="${b}.method" value="${esc(t.method)}" ${dis}></label><label class="f">Instrument<input id="${k}-i" data-bind="${b}.instrument" value="${esc(t.instrument)}" ${dis}></label></div>
  <label class="f">Key result<input id="${k}-r" data-bind="${b}.result" value="${esc(t.result)}" ${dis}></label>
  <div class="form" style="grid-template-columns:1fr 1fr"><label class="f">Limit or expected<input id="${k}-l" data-bind="${b}.limit" value="${esc(t.limit)}" ${dis}></label><label class="f">Outcome<select id="${k}-o" data-bind="${b}.outcome" ${dis}>${OUTCOMES.map(o=>`<option ${o===(t.outcome||"Pending")?"selected":""}>${o}</option>`).join("")}</select></label></div>
  <div><b style="font-size:13px;color:var(--mute)">PDF report</b><div>${report(t)}</div></div>
  ${!lock&&S.assets?`<label class="f">Upload PDF, named ${esc(s.id)}_${k}_01.pdf<input id="${k}-u" type="file" accept="application/pdf" data-up="report" data-test="${k}"></label>`:""}
  ${!lock?`<label class="f">Or paste a link<input id="${k}-d" type="url" data-bind="${b}.link" value="${esc(t.link)}" placeholder="https://..."></label>`:""}</div>`}).join("")}</div>
  <p class="sub">A PDF is a copy. Original instrument data stays in each instrument's data system.</p>
  <div class="panel"><h2>Review and report</h2>
  ${anyFail?`<div class="note">A result failed or wasn't confirmed. Investigate before approving.</div>`:""}
  ${st==="Ready for review"&&self?`<div class="note">You saved these results. A different person should approve them.</div>`:""}
  ${S.readOnly?"":`<div class="row">${st==="Ready for review"?`<button class="btn pri" data-act="approve">Approve results</button>`:""}${st==="Approved"?`<button class="btn pri" data-act="issue">Issue report</button>`:""}</div>`}
  ${!/Ready|Approved|issued/.test(st)?`<p class="sub">Enter a key result and outcome for every test to continue.</p>`:""}${st==="Report issued"?`<p class="sub">The report is issued and these results are locked.</p>`:""}</div>
  ${history(doc)}`;
}
function report(t){
  const a=[];if(t.fileId)a.push(`<a href="#" data-act="open-file" data-file="${esc(t.fileId)}">${esc(t.fileName||"Open PDF")}</a>`);
  const u=safeUrl(t.link);if(u)a.push(`<a href="${esc(u)}" target="_blank" rel="noopener">Link</a>`);
  if(!a.length&&t.fileName)a.push(`<span class="mono">${esc(t.fileName)}</span>`);
  return a.join(" · ")||`<span style="color:var(--mute)">None added</span>`;
}

/* ---------- sample sheets ---------- */
function vSheets(){
  const L=list(S.samples);
  return `<div class="head"><div><h1>Sample sheets</h1><p class="sub">One page for each sample, from synthesis to analytical data.</p></div></div>
  <div class="panel">${L.length?`<div class="tw"><table><tr><th>Sample ID</th><th>Product</th><th>Batch</th><th>Status</th></tr>${L.map(s=>`<tr class="link" data-href="#sheet-${esc(s.id)}"><td class="mono"><a href="#sheet-${esc(s.id)}">${esc(s.id)}</a></td><td>${esc(s.product)}</td><td>${esc(s.batch)}</td><td>${chip(sampleStatus(s))}</td></tr>`).join("")}</table></div>`:`<div class="empty">Sheets appear once a sample is received in the LIMS.</div>`}</div>`;
}
function sheetBody(s,e,dl){
  const c=e?calc(e):{},st=sampleStatus(s),keys=Object.keys(s.tests||{});
  const lim=e&&e.reagents?e.reagents[e.limiting|0]:null;
  const hist=(s.history||[]);const by=a=>{const h=[...hist].reverse().find(x=>x.action===a);return h?whoName(h):"–"};
  const trail=[["Requested",true],["Received",true],["Tested",/Ready|Approved|issued/.test(st)],["Approved",!!s.approved],["Report issued",!!s.reportIssued]];
  return `<div class="grid"><table><tr><td><b>Product</b></td><td>${esc(s.product)}</td><td><b>Batch</b></td><td>${esc(s.batch)}</td></tr><tr><td><b>Project</b></td><td>${esc(e?e.project:"")}</td><td><b>Request</b></td><td class="mono">${esc(s.requestId)}</td></tr></table></div>
  <div class="two"><div style="min-width:0;display:flex;flex-direction:column;gap:8px"><h2>Synthesis</h2>${dl?"":(e?scheme(e):"")}
  <table><tr><td><b>ELN entry</b></td><td class="mono">${esc(s.entryId)}</td></tr><tr><td><b>Chemist</b></td><td>${esc(e?e.chemist:"")}</td></tr><tr><td><b>Scale</b></td><td>${lim?`${esc(lim.mass)} g ${esc(lim.material)}`:"–"}</td></tr><tr><td><b>Yield</b></td><td>${e?`${esc(e.actualYield)} g, ${fix(c.pct,1)}%`:"–"}</td></tr></table></div>
  <div style="min-width:0;display:flex;flex-direction:column;gap:8px"><h2>Analytical data: <span class="mono">${esc(s.anaEntry)}</span></h2><div class="tw"><table><tr><th>Test</th><th>Key result</th><th>Outcome</th><th>Report</th></tr>${keys.map(k=>{const t=s.tests[k];return `<tr><td><b>${esc(TESTNAME[k]||k)}</b></td><td>${esc(t.result)}</td><td>${dl?esc(t.outcome):chip(t.outcome||"Pending")}</td><td>${dl?esc(t.fileName||""):report(t)}</td></tr>`}).join("")}</table></div></div></div>
  <div class="trail">${trail.map(([t,on])=>`<span class="chip ${on?"good":""}">${on?"✓ ":""}${t}</span>`).join("")}</div>
  <table><tr><td><b>Received</b></td><td>${esc(by("Sample received"))}</td><td><b>Approved by</b></td><td>${esc(by("Results approved"))}</td></tr></table>`;
}

/* ---------- actions ---------- */
function setPath(o,p,v){const k=p.split(".");let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v}
function mark(){S.dirty=true;const b=$("#save");if(b)b.textContent="Save changes"}
const busy=async(fn)=>{if(S.busy)return;S.busy=true;document.body.style.cursor="progress";try{await fn()}catch(e){fail(e)}finally{S.busy=false;document.body.style.cursor=""}};
const acts={
  "new-entry"(){busy(async()=>{const d=JSON.parse(await api("createEntry"));S.entries[d.id]=d;go("entry-"+d.id)})},
  "save-entry"(){busy(async()=>{const d=JSON.parse(await api("saveEntry",JSON.stringify(S.draft)));S.entries[d.id]=d;S.dirty=false;S.draft=null;toast("Entry saved");render()})},
  "submit-entry"(){busy(async()=>{const d=JSON.parse(await api("submitEntry",JSON.stringify(S.draft)));S.entries[d.id]=d;S.dirty=false;S.draft=null;toast("Submitted for review");render()})},
  "sign-entry"(){const id=S.draft.id;busy(async()=>{const d=JSON.parse(await api("signEntry",id));S.entries[id]=d;S.dirty=false;S.draft=null;toast("Entry signed. The PDF is saved in LAB-Records.");render()})},
  "reopen-entry"(){const id=S.draft.id,r=($("#reason").value||"").trim();if(!r){toast("Add the reason for reopening.");return}busy(async()=>{const d=JSON.parse(await api("reopenEntry",id,r));S.entries[id]=d;S.dirty=false;S.draft=null;render()})},
  "add-row"(el){const k=el.dataset.k;S.draft[k]=S.draft[k]||[];S.draft[k].push({compounds:{name:"",role:"",smiles:""},reagents:{material:"",mw:"",mass:"",lot:""},steps:{time:"",step:"",temp:"",obs:""}}[k]);S.dirty=true;render()},
  "del-row"(el){const k=el.dataset.k;S.draft[k].splice(+el.dataset.i,1);if(k==="reagents"&&(S.draft.limiting|0)>=S.draft[k].length)S.draft.limiting=0;S.dirty=true;render()},
  "req-from"(el){S.reqFrom=el.dataset.id;go("new-request")},
  "submit-request"(){const d=S.draft;if(!d.tests.length){toast("Choose at least one test.");return}if(!d.quantity){toast("Add the quantity.");return}busy(async()=>{const r=JSON.parse(await api("createRequest",JSON.stringify(d)));S.requests[r.id]=r;S.dirty=false;S.draft=null;S.reqFrom=null;toast("Request "+r.id+" submitted");go("requests")})},
  receive(el){const cond=$("#"+el.dataset.cond).value;busy(async()=>{const id=await api("receiveSample",el.dataset.id,cond);await refresh();toast("Sample received");go("sample-"+id)})},
  "save-sample"(){busy(async()=>{const d=JSON.parse(await api("saveSample",JSON.stringify(S.draft)));S.samples[d.id]=d;S.dirty=false;S.draft=null;toast("Results saved");render()})},
  approve(){if(S.dirty){toast("Save your changes first.");return}const id=S.draft.id;busy(async()=>{const d=JSON.parse(await api("approveSample",id));S.samples[id]=d;S.draft=null;render()})},
  "open-file"(el){const w=window.open("about:blank","_blank");api("fileUrl",el.dataset.file).then(u=>{if(w)w.location=u;else location.href=u}).catch(e=>{if(w)w.close();fail(e)})},
  "sign-out"(){SB.auth.signOut()},
  "magic-link"(){const em=($("#l-email").value||"").trim();if(!em){toast("Enter your email first.");return}
    SB.auth.signInWithOtp({email:em,options:{shouldCreateUser:false,emailRedirectTo:location.origin}}).then(({error})=>{$("#l-msg").textContent=error?error.message:"Check your inbox for the sign-in link."})},
  issue(){const id=S.draft.id;busy(async()=>{const d=JSON.parse(await api("issueReport",id));S.samples[id]=d;S.draft=null;toast("Report issued");go("sheet-"+id)})}
};
document.addEventListener("click",ev=>{
  const a=ev.target.closest("[data-act]");
  if(a){ev.preventDefault();const f=acts[a.dataset.act];if(f)f(a);return}
  const l=ev.target.closest('a[href^="#"]');
  if(l){ev.preventDefault();go(l.getAttribute("href").slice(1));return}
  const r=ev.target.closest("tr[data-href]");if(r&&!ev.target.closest("a,input,select,button"))go(r.dataset.href.slice(1));
});
document.addEventListener("input",ev=>{
  const t=ev.target,b=t.dataset.bind;
  if(b&&S.draft){setPath(S.draft,b,t.value);mark();recalc()}
});
const readB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(f)});
document.addEventListener("change",async ev=>{
  const t=ev.target,d=S.draft;
  if(t.dataset.limit!=null){d.limiting=+t.dataset.limit;mark();recalc()}
  if(t.dataset.check!=null){d.checks[+t.dataset.check]=t.checked;mark()}
  if(t.dataset.test&&d&&d.kind==="req"){d.tests=d.tests.filter(x=>x!==t.dataset.test);if(t.checked)d.tests.push(t.dataset.test);d.tests.sort((a,b)=>TESTS.indexOf(a)-TESTS.indexOf(b))}
  if(t.hasAttribute("data-reqentry")){d.entryId=t.value;render()}
  if(t.dataset.up&&t.files[0]){
    const f=t.files[0];if(f.size>20*1024*1024){toast("That file is over 20 MB. Choose a smaller one.");return}
    toast("Uploading "+f.name);
    busy(async()=>{
      const slot=JSON.parse(await api("uploadFile",JSON.stringify({kind:t.dataset.up,ownerId:d.id,project:d.project,start:d.start,name:f.name,mime:f.type,size:f.size})));
      const up=await SB.storage.from(slot.bucket).uploadToSignedUrl(slot.path,slot.token,f,{contentType:f.type});
      if(up.error)throw new Error("The upload didn't finish: "+up.error.message);
      const r={fileId:slot.fileId,fileName:slot.fileName};
      if(t.dataset.up==="scheme"){d.schemeFileId=r.fileId;S.images[r.fileId]="data:"+f.type+";base64,"+await readB64(f)}
      else{const x=d.tests[t.dataset.test];x.fileId=r.fileId;x.fileName=r.fileName}
      S.dirty=true;toast("Uploaded. Choose Save changes to keep it.");render()
    });
  }
});
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.stale&&!S.dirty&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},0));
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target;
  if(f.dataset.form==="login"){const em=$("#l-email").value.trim(),pw=$("#l-pass").value;if(!pw){toast("Enter your password, or ask for a sign-in link.");return}
    $("#l-msg").textContent="Signing in…";SB.auth.signInWithPassword({email:em,password:pw}).then(({error})=>{if(error)$("#l-msg").textContent=error.message==="Invalid login credentials"?"That email and password don't match.":error.message});return}if(f.dataset.form==="find"){const v=$("#find").value.trim();if(S.samples[v])go("sheet-"+v);else toast("No sample has that ID.")}});
navOnly();
boot();
</script>
